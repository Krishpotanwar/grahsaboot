<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; background: transparent; }
  .tile { position: relative; width: 1024px; height: 1024px; border-radius: 228px; overflow: hidden;
    background: radial-gradient(120% 90% at 30% 15%, #232327 0%, #121214 48%, #09090b 100%);
    box-shadow: inset 0 2px 0 rgb(255 255 255 / .07), inset 0 -2px 0 rgb(0 0 0 / .5); }
  #map { position: absolute; inset: 72px; }
  .shade { position: absolute; inset: 72px; pointer-events: none; background: radial-gradient(circle at 36% 30%, transparent 34%, rgb(9 9 11 / .42) 72%); }
  .win { position: absolute; width: 236px; height: 236px; border-radius: 54px; box-sizing: border-box; border: 18px solid #e48444; overflow: hidden;
    box-shadow: 0 18px 40px rgb(0 0 0 / .45), 0 0 0 6px rgb(9 9 11 / .55); background: #000; }
  .win img { position: absolute; image-rendering: auto; }
  .win::after { content: ''; position: absolute; inset: 0; border-radius: 36px; box-shadow: inset 0 0 0 2px rgb(255 255 255 / .18); }
</style>
</head>
<body>
<div class="tile" id="tile">
  <div id="map"></div>
  <div class="shade"></div>
</div>
<script type="module">
import * as ml from './node_modules/maplibre-gl/dist/maplibre-gl.mjs'
ml.setWorkerUrl('./node_modules/maplibre-gl/dist/maplibre-gl-worker.mjs')
const el = document.getElementById('map')
const zoom = Math.log2((0.47 * el.clientWidth * 2 * Math.PI) / 512) + 0.36
const map = new ml.Map({ container: el, attributionControl: false, interactive: false, center: [78, 14], zoom, canvasContextAttributes: { preserveDrawingBuffer: true },
  style: { version: 8, projection: { type: 'globe' },
    sources: { bm: { type: 'raster', tiles: ['https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg'], tileSize: 256, maxzoom: 8 } },
    layers: [{ id: 'bg', type: 'background', paint: { 'background-color': 'rgba(0,0,0,0)' } }, { id: 'bm', type: 'raster', source: 'bm', paint: { 'raster-fade-duration': 0, 'raster-contrast': 0.08, 'raster-saturation': 0.05 } }],
    sky: { 'atmosphere-blend': 1 } } })
map.once('idle', () => {
  const p = map.project([73.066, 18.991])
  const win = document.createElement('div'); win.className = 'win'
  win.style.left = `${72 + p.x - 118}px`; win.style.top = `${72 + p.y - 118}px`
  // the real 12 Dec 2025 Sentinel-2 window; show the 2 km outline area (pixels ~119–321 x, 19–221 y of 440×240) filling the frame
  win.innerHTML = '<img src="site-20251212.png" alt="" style="width:' + (440 * 200 / 202).toFixed(1) + 'px;height:' + (240 * 200 / 202).toFixed(1) + 'px;left:' + (-119 * 200 / 202).toFixed(1) + 'px;top:' + (-19 * 200 / 202).toFixed(1) + 'px">'
  document.getElementById('tile').append(win)
  setTimeout(() => { document.body.dataset.ready = '1' }, 400)
})
</script>
</body>
</html>
